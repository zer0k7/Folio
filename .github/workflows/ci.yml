name: Continuous Integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x gradlew

      - name: Run Android Lint
        id: run_lint
        continue-on-error: true
        run: ./gradlew lint

      - name: Run Unit Tests
        id: run_tests
        run: ./gradlew test

      - name: Prepare Lint Summary
        id: lint_summary
        run: |
          LINT_REPORT="app/build/reports/lint-results.html"
          if [ -f "$LINT_REPORT" ]; then
            echo "has_report=true" >> $GITHUB_OUTPUT
            echo "Lint report generated successfully."
          else
            echo "has_report=false" >> $GITHUB_OUTPUT
          fi

      - name: Post PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const lintStatus = '${{ steps.run_lint.outcome }}' === 'success' ? 'Passed' : 'Issues Found';
            const testStatus = '${{ steps.run_tests.outcome }}' === 'success' ? 'Passed' : 'Failed';
            
            const body = `### CI Check Results\n\n| Check | Status |\n| :--- | :--- |\n| **Android Lint** | ${lintStatus} |\n| **Unit Tests** | ${testStatus} |\n\n*Automated report generated for commit \`${context.sha.substring(0, 7)}\`.*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Check Step Statuses
        run: |
          if [ "${{ steps.run_lint.outcome }}" != "success" ] || [ "${{ steps.run_tests.outcome }}" != "success" ]; then
            echo "One or more CI checks failed."
            exit 1
          fi
