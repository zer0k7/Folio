name: Build Release APK

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare and Sign APK
        id: sign_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          RELEASE_DIR="app/build/outputs/apk/release"
          APK_PATH=$(find $RELEASE_DIR -name "*.apk" | head -n 1)
          OUTPUT_APK="folio-${TAG_NAME}.apk"

          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found in $RELEASE_DIR"
            exit 1
          fi

          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -V | tail -n 1)
          ZIPALIGN=$(find $ANDROID_SDK_ROOT/build-tools -name zipalign | sort -V | tail -n 1)

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore secret detected. Decoding and signing..."
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            KEY_ALIAS_TO_USE="$KEY_ALIAS"
            STORE_PASS_TO_USE="$STORE_PASSWORD"
            KEY_PASS_TO_USE="$KEY_PASSWORD"
          else
            echo "Generating self-signed release keystore on runner..."
            keytool -genkeypair -v \
              -keystore /tmp/release.keystore \
              -alias folio_release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "foliopassword" \
              -keypass "foliopassword" \
              -dname "CN=Folio, OU=Mobile, O=Folio, L=City, ST=State, C=US"
            KEY_ALIAS_TO_USE="folio_release"
            STORE_PASS_TO_USE="foliopassword"
            KEY_PASS_TO_USE="foliopassword"
          fi

          echo "Aligning APK..."
          $ZIPALIGN -f -v 4 "$APK_PATH" /tmp/aligned.apk

          echo "Signing APK with v1, v2, v3 signature schemes..."
          $APKSIGNER sign \
            --ks /tmp/release.keystore \
            --ks-key-alias "$KEY_ALIAS_TO_USE" \
            --ks-pass "pass:$STORE_PASS_TO_USE" \
            --key-pass "pass:$KEY_PASS_TO_USE" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUTPUT_APK" \
            /tmp/aligned.apk

          echo "Verifying APK signature..."
          $APKSIGNER verify --verbose "$OUTPUT_APK"

          rm -f /tmp/release.keystore /tmp/aligned.apk

          echo "apk_file=$OUTPUT_APK" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: folio-release-${{ github.ref_name }}
          path: ${{ steps.sign_apk.outputs.apk_file }}

      - name: Generate Release Notes
        id: release_notes
        env:
          TAG_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || echo "")
          
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..${TAG_NAME}" --pretty=format:"%s")
          else
            COMMITS=$(git log --pretty=format:"%s")
          fi

          FEATS=$(echo "$COMMITS" | grep -E '^feat' | sed 's/^/- /' || true)
          FIXES=$(echo "$COMMITS" | grep -E '^fix' | sed 's/^/- /' || true)
          CHORES=$(echo "$COMMITS" | grep -E '^(chore|init|refactor|docs|test)' | sed 's/^/- /' || true)
          OTHER=$(echo "$COMMITS" | grep -v -E '^(feat|fix|chore|init|refactor|docs|test)' | sed 's/^/- /' || true)

          BUILD_DATE=$(date -u +"%Y-%m-%d")

          {
            echo "## Folio ${TAG_NAME}"
            echo ""
            echo "### Changes"
            if [ -n "$FEATS" ]; then
              echo "#### Features"
              echo "$FEATS"
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "#### Fixes"
              echo "$FIXES"
              echo ""
            fi
            if [ -n "$CHORES" ]; then
              echo "#### Maintenance"
              echo "$CHORES"
              echo ""
            fi
            if [ -n "$OTHER" ]; then
              echo "#### Other"
              echo "$OTHER"
              echo ""
            fi
            if [ -z "$FEATS" ] && [ -z "$FIXES" ] && [ -z "$CHORES" ] && [ -z "$OTHER" ]; then
              echo "- Initial release"
              echo ""
            fi
            echo "### Build Info"
            echo "- Build date: ${BUILD_DATE}"
            echo "- Commit SHA: ${COMMIT_SHA}"
            echo "- Min SDK: 26"
            echo "- Target SDK: 35"
            echo ""
            echo "### Installation"
            echo "Download the APK below and install via:"
            echo '```bash'
            echo "adb install folio-${TAG_NAME}.apk"
            echo '```'
            echo 'or enable "Install unknown apps" on your Android device and open the APK directly.'
          } > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Folio ${{ github.ref_name }}
          body_path: release_notes.md
          files: ${{ steps.sign_apk.outputs.apk_file }}
          draft: false
          prerelease: false
